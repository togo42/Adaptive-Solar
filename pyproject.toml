[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-solar-ha"
version = "0.2.14"
description = "Physikalische und lernende Solarprognose für Home Assistant"
requires-python = ">=3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pvlib>=0.13,<0.17",
    "scikit-learn>=1.6,<2",
    "aiohttp>=3.11,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.26", "ruff>=0.11"]
ha-test = ["homeassistant==2026.10.4", "pytest-homeassistant-custom-component==0.13.375"]

[tool.setuptools.packages.find]
include = ["custom_components.adaptive_solar*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.adaptive_solar" = ["LICENSE", "*.json", "*.yaml", "translations/*.json", "brand/*.png"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
