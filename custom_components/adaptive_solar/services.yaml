get_reference_forecasts:
  name: Read native reference forecasts
  description: Read native Energy Wh forecasts from explicitly selected loaded Helios or Open-Meteo Solar entries without refreshing them or changing Energy preferences.
  fields:
    config_entry_ids:
      name: Reference entries
      description: Explicit JSON list of loaded Helios or Open-Meteo Solar configuration entry IDs (maximum 16).
      required: true
      selector:
        object: {}
restore_day_start_forecast:
  name: Restore an original day-start forecast
  description: Administrator action to restore one missing historical forecast from a verified original archive and its original site configuration. Never restores training data or replaces an existing day.
  fields:
    config_entry_id:
      name: Adaptive Solar entry
      required: true
      selector:
        config_entry:
          integration: adaptive_solar
    day:
      name: Original target day
      required: true
      selector:
        date: {}
    snapshot:
      name: Original issued_at and energies in kWh
      required: true
      selector:
        object: {}
    source_site:
      name: Original site configuration
      description: Private original site object used to validate location, stages, timezone and original energy bounds. Never publish it.
      required: true
      selector:
        object: {}
export_archive:
  name: Read original-input archive
  description: Administrator-only paginated read of the explicitly enabled private export buffer. Does not refresh forecasts or acknowledge/delete data.
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: adaptive_solar
    cursor:
      selector:
        text: {}
    generation:
      selector:
        text: {}
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    max_bytes:
      default: 2097152
      selector:
        number:
          min: 1024
          max: 4194304
          mode: box
