name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            custom_components/adaptive_solar/manifest.json
      - name: Install test and declared HA runtime dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          requirements = json.loads(Path("custom_components/adaptive_solar/manifest.json").read_text())["requirements"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", ".[test,ha-test]", *requirements])
          PY
      - run: python -m pip check
      - run: ruff check custom_components tests scripts
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
