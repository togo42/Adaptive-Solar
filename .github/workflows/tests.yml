name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  archive-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install archive runtime without Home Assistant
        run: python scripts/install_archive_host.py --venv .archive-venv
      - name: Import archive tools without HA
        run: |
          .archive-venv/bin/python scripts/archive_host.py --help
          .archive-venv/bin/python scripts/archive.py --help
          .archive-venv/bin/python scripts/capture_weather.py --help
          .archive-venv/bin/python scripts/archive_observations.py --help
          .archive-venv/bin/python scripts/replay_archive.py --help
          .archive-venv/bin/python scripts/replay_shading.py --help
          .archive-venv/bin/python scripts/analyze_learning_support.py --help
          .archive-venv/bin/python scripts/qualify_actuals.py --help
          .archive-venv/bin/python scripts/continuous_quality.py --help
          .archive-venv/bin/python scripts/native_quality_manifest.py --help
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            custom_components/adaptive_solar/manifest.json
            custom_components/adaptive_solar/runtime_requirements.json
      - name: Install test and declared HA runtime dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          requirements = json.loads(Path("custom_components/adaptive_solar/manifest.json").read_text())["requirements"]
          runtime = json.loads(Path("custom_components/adaptive_solar/runtime_requirements.json").read_text())
          requirements += runtime["requirements"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", ".[test,ha-test]", *requirements])
          PY
      - run: python -m pip check
      - run: ruff check custom_components tests scripts tools/ml_runtime
      - name: Build optional native quality backend
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          PYO3_PYTHON="$(command -v python)" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/artifacts/rust-ci" \
            cargo +1.90.0 build --locked --release --manifest-path rust/archive_probe/Cargo.toml
          echo "ADAPTIVE_SOLAR_TEST_NATIVE_QUALITY_BINARY=$GITHUB_WORKSPACE/artifacts/rust-ci/release/lib_archive_probe.so" >> "$GITHUB_ENV"
      - name: Explicit native differential gates
        run: |
          mkdir -p artifacts/native-contract-source
          git archive 2dd940c3aa1a00d7291228f24ebaac90b56eef14 custom_components scripts \
            | tar -x -C artifacts/native-contract-source
          export ADAPTIVE_SOLAR_RUST_MODULE="$ADAPTIVE_SOLAR_TEST_NATIVE_QUALITY_BINARY"
          export ADAPTIVE_SOLAR_RUST_MODULE_SHA256="$(sha256sum "$ADAPTIVE_SOLAR_RUST_MODULE" | cut -d' ' -f1)"
          export ADAPTIVE_SOLAR_QUALITY_SOURCE_ROOT="$GITHUB_WORKSPACE/artifacts/native-contract-source"
          python -m pytest -q rust/archive_probe/tests/test_differential.py rust/archive_probe/tests/test_projection.py
      - name: Native HA tests and line/branch coverage
        run: >-
          python -m pytest -q --junitxml=artifacts/tests.xml
          --cov=custom_components.adaptive_solar --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml:artifacts/coverage.xml
          --cov-report=json:artifacts/coverage.json
      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-coverage
          path: |
            artifacts/tests.xml
            artifacts/coverage.xml
            artifacts/coverage.json
          if-no-files-found: warn
          retention-days: 14
